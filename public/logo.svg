<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">
  <defs>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.4  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.08 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <clipPath id="torn">
      <path d="M0,0 H480 V160
        L470,170 L460,162 L450,170 L440,162 L430,170 L420,162 L410,170 L400,162
        L390,170 L380,162 L370,170 L360,162 L350,170 L340,162 L330,170 L320,162
        L310,170 L300,162 L290,170 L280,162 L270,170 L260,162 L250,170 L240,162
        L230,170 L220,162 L210,170 L200,162 L190,170 L180,162 L170,170 L160,162
        L150,170 L140,162 L130,170 L120,162 L110,170 L100,162 L90,170 L80,162
        L70,170 L60,162 L50,170 L40,162 L30,170 L20,162 L10,170 L0,162 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#torn)">
    <rect width="480" height="170" fill="#f4ecd8"/>
    <rect width="480" height="170" fill="#000" filter="url(#noise)"/>

    <text x="240" y="78" text-anchor="middle"
      font-family="'JetBrains Mono', ui-monospace, monospace"
      font-weight="700" font-size="64" letter-spacing="14"
      fill="#1a1410">CEIPT</text>

    <g stroke="#1a1410" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round">
      <line x1="40" y1="100" x2="440" y2="100"/>
    </g>

    <text x="240" y="128" text-anchor="middle"
      font-family="'JetBrains Mono', ui-monospace, monospace"
      font-weight="500" font-size="13" letter-spacing="8"
      fill="#3d2f24">PRINT YOUR ONCHAIN MEMORIES</text>
  </g>
</svg>
